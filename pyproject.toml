[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rfp-orchestrator"
version = "0.1.0"
description = "Evidence-grounded, risk-aware Enterprise RFP Response Orchestrator"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3",
  "langgraph>=0.2",
  "langsmith>=0.2",
  "openai>=1.0",
  "pinecone>=5.0",
  "streamlit>=1.38",
  "python-docx>=1.1",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
